document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

10-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"35d199ab-4dfa-4731-8b1b-61178ba0dcce\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"d5bb0a33-6d29-4ace-b39c-0325a91ec6c0\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* cyrillic-ext */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"91f1fcef-fc1f-483b-a150-6e3515396539\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"a40f51d8-9b41-41a2-8dbf-1787725b3ef7\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* greek */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"ff7cf12d-5507-49cd-ba5f-200fb47c0543\") format('woff2');\n  unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"caeb5aea-31d1-49f0-a0eb-93ca44cbebc7\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"35d199ab-4dfa-4731-8b1b-61178ba0dcce\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"d5bb0a33-6d29-4ace-b39c-0325a91ec6c0\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* =========================================================================\n   COLOR TOKENS\n   -------------------------------------------------------------------------\n   The DAP brand is built around two elements:\n   1. The CHARCOAL tail/wing — quiet, authoritative, the \"company\" color.\n   2. The GRADIENT fin — sunrise over the Drake Passage: yellow → orange → red → blue.\n   The gradient is the soul of the brand; it should feel SPARINGLY USED\n   (accent, data viz, key flourishes), never wallpapered.\n   ========================================================================= */\n:root {\n  /* ---- Primary: Charcoal (the tail) ---- */\n  --dap-charcoal-950: #0E1013;   /* near-black, type on white, strong bg */\n  --dap-charcoal-900: #1A1D22;   /* default ink, body text */\n  --dap-charcoal-800: #2A2E35;   /* body text on colored bg */\n  --dap-charcoal-700: #3F454E;   /* secondary ink */\n  --dap-charcoal-500: #6B7280;   /* muted text */\n  --dap-charcoal-300: #B8BCC3;   /* borders, dividers */\n  --dap-charcoal-200: #D9DCE0;   /* subtle dividers */\n  --dap-charcoal-100: #EEF0F2;   /* surface / hover */\n  --dap-charcoal-50:  #F6F7F8;   /* page bg alternate */\n\n  /* ---- Gradient stops (sampled from the isotipo) ---- */\n  --dap-sun:    #F7A518;   /* yellow — top of fin */\n  --dap-ember:  #E85A1A;   /* orange */\n  --dap-ruby:   #D1303C;   /* red */\n  --dap-magma:  #8C2750;   /* transition purple-red */\n  --dap-deep:   #1E3A8A;   /* deep blue — bottom of fin */\n\n  /* ---- Accents (derived, used for UI affordances) ---- */\n  --dap-accent:         var(--dap-ember);   /* default brand accent */\n  --dap-accent-hover:   #CE4A10;\n  --dap-accent-press:   #B43F0A;\n  --dap-accent-tint:    #FCE9DA;            /* light backgrounds, highlights */\n\n  /* ---- Signature gradient ---- */\n  --dap-gradient: linear-gradient(\n    140deg,\n    var(--dap-sun) 0%,\n    var(--dap-ember) 28%,\n    var(--dap-ruby) 52%,\n    var(--dap-magma) 75%,\n    var(--dap-deep) 100%\n  );\n  --dap-gradient-horizontal: linear-gradient(\n    90deg,\n    var(--dap-sun) 0%,\n    var(--dap-ember) 28%,\n    var(--dap-ruby) 52%,\n    var(--dap-magma) 75%,\n    var(--dap-deep) 100%\n  );\n  /* A thin signature rule used as a decorative divider */\n  --dap-gradient-rule: linear-gradient(\n    90deg,\n    var(--dap-sun) 0%, var(--dap-ember) 30%, var(--dap-ruby) 55%, var(--dap-deep) 100%\n  );\n\n  /* ---- Semantic surfaces ---- */\n  --bg:            #FFFFFF;\n  --bg-subtle:     var(--dap-charcoal-50);\n  --bg-muted:      var(--dap-charcoal-100);\n  --bg-inverse:    var(--dap-charcoal-950);\n\n  --fg1:           var(--dap-charcoal-900);   /* primary ink */\n  --fg2:           var(--dap-charcoal-700);   /* secondary */\n  --fg3:           var(--dap-charcoal-500);   /* muted / caption */\n  --fg-on-dark:    #FFFFFF;\n  --fg-on-dark-2:  #C8CBD1;\n\n  --border:        var(--dap-charcoal-200);\n  --border-strong: var(--dap-charcoal-300);\n  --divider:       var(--dap-charcoal-100);\n\n  /* ---- Semantic state ---- */\n  --success: #1E7F4F;\n  --success-tint: #E3F2EA;\n  --warning: var(--dap-sun);\n  --warning-tint: #FDF2DC;\n  --danger:  var(--dap-ruby);\n  --danger-tint: #FBE4E6;\n  --info:    var(--dap-deep);\n  --info-tint: #E1E7F4;\n\n  /* =======================================================================\n     TYPOGRAPHY TOKENS\n     -----------------------------------------------------------------------\n     Display family: Barlow (geometric, condensed feel; echoes DAP wordmark)\n     UI / Body:      DM Sans (neutral, modern, high legibility)\n     Mono:           JetBrains Mono (for numeric/tabular + code)\n     ======================================================================= */\n  --font-display: 'Barlow', 'Helvetica Neue', Arial, sans-serif;\n  --font-body:    'DM Sans', 'Helvetica Neue', Arial, sans-serif;\n  --font-mono:    'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;\n\n  /* Weights */\n  --fw-regular: 400; /* @kind font */\n  --fw-medium:  500; /* @kind font */\n  --fw-semibold:600; /* @kind font */\n  --fw-bold:    700; /* @kind font */\n  --fw-black:   900; /* @kind font */\n\n  /* Type scale (rem-based, 16px root) */\n  --fs-xs:   12px;\n  --fs-sm:   14px;\n  --fs-base: 16px;\n  --fs-md:   18px;\n  --fs-lg:   20px;\n  --fs-xl:   24px;\n  --fs-2xl:  32px;\n  --fs-3xl:  42px;\n  --fs-4xl:  56px;\n  --fs-5xl:  72px;\n  --fs-6xl:  96px;\n\n  /* Line heights */\n  --lh-tight:   1.05; /* @kind font */\n  --lh-snug:    1.2; /* @kind font */\n  --lh-normal:  1.45; /* @kind font */\n  --lh-relaxed: 1.6; /* @kind font */\n\n  /* Letter spacing */\n  --ls-tighter: -0.03em; /* @kind font */\n  --ls-tight:   -0.015em; /* @kind font */\n  --ls-normal:  0; /* @kind font */\n  --ls-wide:    0.04em; /* @kind font */\n  --ls-wider:   0.12em; /* @kind font */    /* for small-caps eyebrow labels */\n\n  /* =======================================================================\n     SPACING / SIZING / RADII / SHADOWS\n     ======================================================================= */\n  --space-0:  0;\n  --space-1:  4px;\n  --space-2:  8px;\n  --space-3:  12px;\n  --space-4:  16px;\n  --space-5:  20px;\n  --space-6:  24px;\n  --space-7:  32px;\n  --space-8:  40px;\n  --space-9:  56px;\n  --space-10: 72px;\n  --space-11: 96px;\n  --space-12: 128px;\n\n  --radius-xs:  2px;\n  --radius-sm:  4px;\n  --radius-md:  8px;\n  --radius-lg:  12px;\n  --radius-xl:  16px;\n  --radius-2xl: 24px;\n  --radius-pill: 999px;\n\n  /* Shadows — subtle, \"document\" feel, never flashy */\n  --shadow-xs: 0 1px 2px rgba(14, 16, 19, 0.05);\n  --shadow-sm: 0 1px 3px rgba(14, 16, 19, 0.06), 0 1px 2px rgba(14, 16, 19, 0.04);\n  --shadow-md: 0 4px 10px -2px rgba(14, 16, 19, 0.08), 0 2px 4px -2px rgba(14, 16, 19, 0.04);\n  --shadow-lg: 0 12px 24px -6px rgba(14, 16, 19, 0.12), 0 4px 8px -4px rgba(14, 16, 19, 0.06);\n  --shadow-xl: 0 24px 48px -12px rgba(14, 16, 19, 0.18);\n\n  /* Borders */\n  --border-w:     1px;\n  --border-w-lg:  2px;\n  --border-w-xl:  3px;\n\n  /* Motion */\n  --ease-standard: cubic-bezier(0.2, 0, 0, 1); /* @kind other */\n  --ease-emph:     cubic-bezier(0.3, 0, 0, 1); /* @kind other */\n  --dur-fast:      120ms; /* @kind other */\n  --dur-base:      200ms; /* @kind other */\n  --dur-slow:      320ms; /* @kind other */\n}\n\n/* =========================================================================\n   SEMANTIC TYPE STYLES — apply directly via class, or reference vars\n   ========================================================================= */\n.dap-eyebrow {\n  font-family: var(--font-body);\n  font-weight: var(--fw-semibold);\n  font-size:   var(--fs-xs);\n  letter-spacing: var(--ls-wider);\n  text-transform: uppercase;\n  color: var(--fg3);\n}\n\n.dap-display {\n  font-family: var(--font-display);\n  font-weight: var(--fw-black);\n  font-size:   var(--fs-6xl);\n  line-height: var(--lh-tight);\n  letter-spacing: var(--ls-tighter);\n  color: var(--fg1);\n}\n\nh1, .dap-h1 {\n  font-family: var(--font-display);\n  font-weight: var(--fw-bold);\n  font-size:   var(--fs-4xl);\n  line-height: var(--lh-tight);\n  letter-spacing: var(--ls-tight);\n  color: var(--fg1);\n}\n\nh2, .dap-h2 {\n  font-family: var(--font-display);\n  font-weight: var(--fw-bold);\n  font-size:   var(--fs-3xl);\n  line-height: var(--lh-snug);\n  letter-spacing: var(--ls-tight);\n  color: var(--fg1);\n}\n\nh3, .dap-h3 {\n  font-family: var(--font-display);\n  font-weight: var(--fw-semibold);\n  font-size:   var(--fs-2xl);\n  line-height: var(--lh-snug);\n  color: var(--fg1);\n}\n\nh4, .dap-h4 {\n  font-family: var(--font-body);\n  font-weight: var(--fw-semibold);\n  font-size:   var(--fs-xl);\n  line-height: var(--lh-snug);\n  color: var(--fg1);\n}\n\nh5, .dap-h5 {\n  font-family: var(--font-body);\n  font-weight: var(--fw-semibold);\n  font-size:   var(--fs-lg);\n  line-height: var(--lh-normal);\n  color: var(--fg1);\n}\n\np, .dap-body {\n  font-family: var(--font-body);\n  font-weight: var(--fw-regular);\n  font-size:   var(--fs-base);\n  line-height: var(--lh-relaxed);\n  color: var(--fg1);\n  text-wrap: pretty;\n}\n\n.dap-body-lg {\n  font-size: var(--fs-md);\n  line-height: var(--lh-relaxed);\n}\n\n.dap-body-sm {\n  font-size: var(--fs-sm);\n  line-height: var(--lh-normal);\n}\n\n.dap-caption {\n  font-family: var(--font-body);\n  font-size:   var(--fs-xs);\n  color: var(--fg3);\n  letter-spacing: 0.01em;\n}\n\n.dap-quote {\n  font-family: var(--font-display);\n  font-weight: var(--fw-medium);\n  font-size:   var(--fs-3xl);\n  line-height: var(--lh-snug);\n  letter-spacing: var(--ls-tight);\n  font-style: italic;\n  color: var(--fg1);\n}\n\ncode, .dap-code {\n  font-family: var(--font-mono);\n  font-size:   0.9em;\n  background:  var(--bg-muted);\n  padding:     0.15em 0.4em;\n  border-radius: var(--radius-sm);\n  color: var(--fg1);\n}\n\n/* Number / data display — use mono for tabular alignment */\n.dap-tabular {\n  font-family: var(--font-body);\n  font-variant-numeric: tabular-nums;\n  font-feature-settings: \"tnum\";\n}\n\n/* =========================================================================\n   UTILITY: the signature gradient, as a text fill or background\n   ========================================================================= */\n.dap-text-gradient {\n  background: var(--dap-gradient-horizontal);\n  -webkit-background-clip: text;\n  background-clip: text;\n  color: transparent;\n}\n\n.dap-bg-gradient {\n  background: var(--dap-gradient);\n}\n\n/* Logo on a dark background — inverts the charcoal type to white while\n   keeping the gradient fin readable. Apply to <img> of any DAP logo asset. */\n.dap-logo-on-dark {\n  filter: invert(1) hue-rotate(180deg) brightness(1.1) saturate(1.4);\n}\n\n.dap-rule {\n  height: 3px;\n  border: none;\n  background: var(--dap-gradient-rule);\n  border-radius: var(--radius-pill);\n}\n<\u002Fstyle>\n<script src=\"0912e2a5-0e04-492c-81d7-06564501ff76\"><\u002Fscript>\n<script src=\"81aadb74-b260-46de-9069-bc9ef5fb2798\"><\u002Fscript>\n<style>\nhtml,body{margin:0;padding:0}\nbody{background:#F6F7F8;-webkit-font-smoothing:antialiased}\n[data-theme=\"light\"]{--pg:#F6F7F8;--sf:#FFFFFF;--sf2:#EEF0F2;--ink:#1A1D22;--ink2:#3F454E;--ink3:#6B7280;--ln:#D9DCE0;--ln2:#B8BCC3;--acc:#E85A1A;--acc-h:#CE4A10;--acc-t:#FCE9DA;--acc-ink:#B43F0A;--ok:#1E7F4F;--ok-t:#E3F2EA;--bad:#D1303C;--bad-t:#FBE4E6;--warn-ink:#8A5A00;--warn-t:#FDF2DC;--info:#1E3A8A;--info-t:#E1E7F4;--p1:#1E3A8A;--p2:#8C2750;--p1-t:#E1E7F4;--p2-t:#F4E1EA;--ovl:rgba(14,16,19,.45);color-scheme:light}\n[data-theme=\"dark\"]{--pg:#0E1013;--sf:#1A1D22;--sf2:#2A2E35;--ink:#FFFFFF;--ink2:#C8CBD1;--ink3:#9AA0A9;--ln:#2A2E35;--ln2:#3F454E;--acc:#E85A1A;--acc-h:#F06B2E;--acc-t:#3A2216;--acc-ink:#F7A06A;--ok:#5BC48E;--ok-t:#16291F;--bad:#F06A73;--bad-t:#341A1E;--warn-ink:#F7C25A;--warn-t:#33280F;--info:#93A9EA;--info-t:#1A2340;--p1:#93A9EA;--p2:#E58AB0;--p1-t:#1A2340;--p2-t:#36182A;--ovl:rgba(0,0,0,.6 items||[]).map(i=>typeof i==='string'?i:i.nombre):[];}\n  normForm(f,pre){const list=this.catsFor(f.tipo);const cat=list.find(c=>c.nombre===f.cat)?f.cat:(list[0]?list[0].nombre:'');const c=list.find(x=>x.nombre===cat);const items=this.itemsOf(c);\n    const item=(f.item==='__otro__'||items.includes(f.item))?f.item:(items[0]||'__otro__');const o={...f,cat,item};\n    if(pre&&f.tipo==='fijo'&&c){const it=(c.items||[]).find(i=>i.nombre===item);if(it){o.monto=it.montoHabitual?String(it.montoHabitual):'';o.cuenta=it.cuentaDestino||'';}}return o;}\n  normP(f){const list=this.D.CATSP.filter(c=>c.tipo===f.tipo);const cat=list.find(c=>c.nombre===f.cat)?f.cat:(list[0]?list[0].nombre:'');const items=this.itemsOf(list.find(x=>x.nombre===cat));\n    const item=(f.item==='__otro__'||items.includes(f.item))?f.item:(items[0]||'__otro__');return{...f,cat,item};}\n  setF(k,pre){return e=>{const v=e&&e.target?e.target.value:e;this.setState(st=>({form:this.normForm({...st.form,[k]:v},pre)}));};}\n  setP(k){return e=>{const v=e&&e.target?e.target.value:e;this.setState(st=>({pform:this.normP({...st.pform,[k]:v})}));};}\n  setD(k){return e=>{const v=e.target.type==='checkbox'?e.target.checked:e.target.value;this.setState(st=>({draft:{...st.draft,[k]:v}}));};}\n  setS(k){return e=>{const v=e.target.value;this.setState({[k]:v});};}\n  done(msg){GC.S.persist();this.forceUpdate();if(msg)this.aviso(msg);}\n  guardadoMsg(){return GC.S.demo?'Guardado (demostración).':this.D.URL?'Guardado y enviado a Sheets.':'Guardado en este dispositivo.';}\n\n  /* ---------- Casa: movimientos ---------- */\n  guardarMov(){const S=GC.S,D=this.D,f=this.state.form;const monto=parseFloat(f.monto);if(!monto||monto<=0)return this.aviso('Ingrese un monto.');\n    const fecha=f.fecha||GC.iso(),d=new Date(fecha+'T00:00:00');let categoria='Aporte Fondo Común',item='Aporte';\n    if(f.tipo!=='aporte'){categoria=f.cat;item=f.item==='__otro__'?f.itemOtro.trim():f.item;if(!item)return this.aviso('Falta el ítem.');}\n    const persona=(f.tipo==='cuenta'||f.tipo==='aporte')?D.CONFIG[f.persona]:'';const pagado=f.tipo==='aporte'||f.tipo==='cuenta'||f.pagado==='si';\n    const mv={id:'m'+Date.now()+Math.floor(Math.random()*1000),tipoMovimiento:f.tipo,fecha,mes:d.getMonth(),anio:d.getFullYear(),categoria,item,monto,persona,notas:f.notas.trim(),tieneFotos:!!this.foto,pagado,fechaPago:pagado?new Date().toISOString():'',cuentaOrigen:(f.tipo==='fijo'||f.tipo==='variable')?f.cuenta:''};\n    D.MOVS.push(mv);if(this.foto)D.FOTOS[mv.id]=this.foto;this.foto=null;\n    if(f.tipo==='fijo'){const c=D.CATS.find(x=>x.nombre===categoria);const it=c&&(c.items||[]).find(i=>i.nombre===item);if(it&&it.medioPago==='Crédito'&&it.nCuotas>0&&(it.cuotaActual||0)<it.nCuotas){it.cuotaActual=(it.cuotaActual||0)+1;S.syncCats();}}\n    S.sync('movimiento',GC.payload(mv));\n    this.setState(st=>({fotoPrev:'',form:this.normForm({...st.form,monto:'',itemOtro:'',notas:''},true)}));this.done(this.guardadoMsg());}\n  pagar(id){const m=this.D.MOVS.find(x=>x.id===id);if(!m)return;m.pagado=true;m.fechaPago=new Date().toISOString();GC.S.sync('movimiento',GC.payload(m));this.done('Marcado como pagado.');}\n  eliminar(id,personal){if(!confirm('¿Eliminar este movimiento? No se puede deshacer.'))return;const D=this.D;\n    if(personal){D.PMOVS=D.PMOVS.filter(x=>x.id!==id);GC.S.sync('eliminar_personal_movimiento',{id});}else{D.MOVS=D.MOVS.filter(x=>x.id!==id);delete D.FOTOS[id];GC.S.sync('eliminar_movimiento',{id});}\n    D.ELIM.ids.push(id);this.setState({modal:null,draft:null});this.done('Movimiento eliminado.');}\n  abrirEditar(id,personal){const D=this.D,m=(personal?D.PMOVS:D.MOVS).find(x=>x.id===id);if(!m)return;\n    this.setState({modal:'mov',draft:{id,personal:!!personal,tipo:m.tipoMovimiento,categoria:m.categoria,item:m.item,monto:String(m.monto),fecha:m.fecha,persona:m.persona===D.CONFIG.p2?'p2':'p1',notas:m.notas||'',pagado:!!m.pagado,cuenta:m.cuentaOrigen||'',foto:D.FOTOS[id]||''}});}\n  guardarEdicion(){const D=this.D,dr=this.state.draft,lista=dr.personal?D.PMOVS:D.MOVS,m=lista.find(x=>x.id===dr.id);if(!m)return;\n    m.categoria=dr.categoria.trim();m.item=dr.item.trim();m.monto=parseFloat(dr.monto)||m.monto;m.fecha=dr.fecha||m.fecha;const d=new Date(m.fecha+'T00:00:00');m.mes=d.getMonth();m.anio=d.getFullYear();m.notas=dr.notas.trim();\n    if(dr.personal||m.tipoMovimiento==='cuenta'||m.tipoMovimiento==='aporte')m.persona=D.CONFIG[dr.persona];\n    if(dr.personal){GC.S.sync('personal_movimiento',GC.ppayload(m));}\n    else{if(m.tipoMovimiento==='fijo'||m.tipoMovimiento==='variable'){if(dr.pagado&&!m.pagado)m.fechaPago=new Date().toISOString();if(!dr.pagado)m.fechaPago='';m.pagado=!!dr.pagado;m.cuentaOrigen=dr.cuenta;}GC.S.sync('movimiento',GC.payload(m));}\n    this.setState({modal:null,draft:null});this.done('Movimiento actualizado.');}\n  abrirCarga(){const D=this.D,now=new Date(),mm=now.getMonth(),aa=now.getFullYear();\n    const ya=new Set(D.MOVS.filter(m=>(m.tipoMovimiento==='fijo'||m.tipoMovimiento==='variable')&&m.mes===mm&&m.anio===aa).map(m=>m.tipoMovimiento+'||'+m.categoria+'||'+m.item));const rows=[];\n    D.CATS.filter(c=>c.tipo==='fijo').forEach(c=>(c.items||[]).forEach((it,i)=>{const r=ya.has('fijo||'+c.nombre+'||'+it.nombre);rows.push({tipo:'fijo',cat:c.nombre,item:it.nombre,monto:String(it.montoHabitual||0),check:!r&&!!it.montoHabitual,ya:r,header:i===0?c.nombre:'',cuenta:it.cuentaDestino||''});}));\n    D.CATS.filter(c=>c.tipo==='variable').forEach((c,i)=>{const r=ya.has('variable||'+c.nombre+'||'+c.nombre);rows.push({tipo:'variable',cat:c.nombre,item:c.nombre,monto:String(c.presupuesto||0),check:!r,ya:r,header:i===0?'Presupuestos variables':'',cuenta:''});});\n    this.setState({modal:'carga',draft:{fecha:GC.iso(),rows}});}\n  guardarCarga(){const S=GC.S,D=this.D,dr=this.state.draft,d=new Date(dr.fecha+'T00:00:00');let n=0;\n    dr.rows.forEach(r=>{if(!r.check)return;const monto=parseFloat(r.monto);if(!monto||monto<=0)return;\n      const m={id:'m'+Date.now()+Math.floor(Math.random()*1000)+n,tipoMovimiento:r.tipo,fecha:dr.fecha,mes:d.getMonth(),anio:d.getFullYear(),categoria:r.cat,item:r.item,monto,persona:'',notas:'',tieneFotos:false,pagado:false,fechaPago:'',cuentaOrigen:r.cuenta};\n      D.MOVS.push(m);S.sync('movimiento',GC.payload(m));\n      if(r.tipo==='fijo'){const c=D.CATS.find(x=>x.nombre===r.cat);const it=c&&c.items.find(i=>i.nombre===r.item);if(it&&it.medioPago==='Crédito'&&it.nCuotas>0&&(it.cuotaActual||0)<it.nCuotas)it.cuotaActual=(it.cuotaActual||0)+1;}n++;});\n    if(n)S.syncCats();this.setState({modal:null,draft:null});this.done(n+' movimientos cargados.');}\n  onFoto(e){const file=e.target.files[0];if(!file)return;const rd=new FileReader();rd.onload=ev=>{const img=new Image();img.onload=()=>{const cv=document.createElement('canvas');let w=img.width,h=img.height,mx=1200;\n      if(w>h&&w>mx){h=h*mx/w;w=mx;}else if(h>mx){w=w*mx/h;h=mx;}cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);this.foto=cv.toDataURL('image/jpeg',0.85);this.setState({fotoPrev:this.foto});};img.src=ev.target.result;};rd.readAsDataURL(file);}\n\n  /* ---------- Cierre ---------- */\n  cerrar(){const s=this.state;if(!confirm('¿Cerrar '+GC.MESES[s.mes]+' '+s.anio+'? El saldo de cada uno con la casa pasa a su aporte del mes siguiente.'))return;GC.S.cerrarMes(s.mes,s.anio,s.cierreOff);this.setState({cierreOff:{}});this.done('Mes cerrado.');}\n  reabrir(){GC.S.reabrir(this.state.mes,this.state.anio);this.done('Cierre reabierto.');}\n\n  /* ---------- Cuotas ---------- */\n  abrirCuota(idx){const q=idx==null?null:this.D.CUOTAS[idx];const f=this.D.CATS.filter(c=>c.tipo==='fijo');\n    this.setState({modal:'cuota',draft:q?{idx,nombre:q.nombre,categoria:q.categoria,montoCuota:String(q.montoCuota),nCuotas:String(q.nCuotas),cuotaActual:String(q.cuotaActual),cuentaDestino:q.cuentaDestino||''}:{idx:null,nombre:'',categoria:f[0]?f[0].nombre:'',montoCuota:'',nCuotas:'',cuotaActual:'0',cuentaDestino:''}});}\n  guardarCuota(){const D=this.D,dr=this.state.draft,n=parseInt(dr.nCuotas),mc=parseFloat(dr.montoCuota);if(!dr.nombre.trim()||!n||!mc)return this.aviso('Complete nombre, monto y número de cuotas.');\n    const q={id:dr.idx==null?'q'+Date.now():D.CUOTAS[dr.idx].id,nombre:dr.nombre.trim(),categoria:dr.categoria,montoCuota:mc,nCuotas:n,cuotaActual:parseInt(dr.cuotaActual)||0,cuentaDestino:dr.cuentaDestino};q.activo=q.cuotaActual<q.nCuotas;\n    if(dr.idx==null)D.CUOTAS.push(q);else D.CUOTAS[dr.idx]=q;GC.S.sync('cuotas',D.CUOTAS);this.setState({modal:null,draft:null});this.done('Compra a cuotas guardada.');}\n  borrarCuota(){const dr=this.state.draft;if(dr.idx==null||!confirm('¿Eliminar esta compra a cuotas? Los movimientos ya generados se mantienen.'))return;this.D.CUOTAS.splice(dr.idx,1);GC.S.sync('cuotas',this.D.CUOTAS);this.setState({modal:null,draft:null});this.done('Compra eliminada.');}\n\n  /* ---------- Categorías ---------- */\n  abrirCat(scope,tipo,idx){const D=this.D,lista=scope==='p'?D.CATSP:D.CATS,c=idx==null?null:lista[idx];\n    const items=tipo==='fijo'?(c?c.items.map(i=>({nombre:i.nombre,montoHabitual:String(i.montoHabitual||''),medioPago:i.medioPago||'Débito',cuentaDestino:i.cuentaDestino||'',nCuotas:i.nCuotas||0,cuotaActual:i.cuotaActual||0})):[{nombre:'',montoHabitual:'',medioPago:'Débito',cuentaDestino:''}]):[];\n    this.setState({modal:'cat',draft:{scope,tipo,idx,nombre:c?c.nombre:'',items,itemsTxt:c&&tipo!=='fijo'?(c.items||[]).join('\\n'):'',presupuesto:c&&c.presupuesto?String(c.presupuesto):''}});}\n  setItem(i,k){return e=>{const v=e.target.value;this.setState(st=>{const items=st.draft.items.slice();items[i]={...items[i],[k]:v};return{draft:{...st.draft,items}};});};}\n  guardarCat(){const S=GC.S,D=this.D,dr=this.state.draft,nombre=dr.nombre.trim();if(!nombre)return this.aviso('Falta el nombre.');let c;\n    if(dr.tipo==='fijo')c={tipo:'fijo',nombre,items:dr.items.filter(i=>i.nombre.trim()).map(i=>({nombre:i.nombre.trim(),montoHabitual:parseFloat(i.montoHabitual)||0,m
